{% extends 'base.html' %} {% load static %} {% block content %}
<section class="gallery-section">
  <h1>Ministry Gallery</h1>
  <p>
    Moments from our ministry work, worship services, children outreach, and
    community activities in Nimule.
  </p>
  <div class="gallery-grid">
    <img
      src="{% static 'images/bigGodKids.jpeg' %}"
      alt="Gallery Image"
      onclick="openLightbox(this.src)"
    />
    <img
      src="{% static 'images/choir.jpeg' %}"
      alt="Gallery Image"
      onclick="openLightbox(this.src)"
    />
    <img
      src="{% static 'images/choir2.jpeg' %}"
      alt="Gallery Image"
      onclick="openLightbox(this.src)"
    />
    <img
      src="{% static 'images/hero1home.jpeg' %}"
      alt="Gallery Image"
      onclick="openLightbox(this.src)"
    />
    <img
      src="{% static 'images/pastors.jpeg' %}"
      alt="Gallery Image"
      onclick="openLightbox(this.src)"
    />
    <img
      src="{% static 'images/gallery6.jpg' %}"
      alt="Gallery Image"
      onclick="openLightbox(this.src)"
    />
  </div>
  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox">
    <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img" src="" alt="Expanded Image" />
  </div>
</section>
<script>
  function openLightbox(imageSrc) {
    document.getElementById("lightbox").classList.add("active");

    document.getElementById("lightbox-img").src = imageSrc;
  }

  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("active");
  }
</script>
{% endblock %}
